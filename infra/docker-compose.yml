services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: didi
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  redis:
    image: public.ecr.aws/docker/library/redis:7
    ports:
      - "6379:6379"
  kafka:
    image: public.ecr.aws/bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  api:
    build: ../backend
    command: ["/bin/didi-api"]
    expose:
      - "8080"
    depends_on:
      - mysql
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  auth-service:
    build: ../backend
    command: ["/bin/didi-auth-service"]
    expose:
      - "18081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  gateway:
    build: ../backend
    command: ["/bin/didi-gateway"]
    environment:
      API_BASE: http://api:8080
      AUTH_BASE: http://auth-service:18081
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
  frontend:
    build: ../frontend
    ports:
      - "8081:80"
    depends_on:
      gateway:
        condition: service_started
